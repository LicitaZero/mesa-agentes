name: Verificar Mesa

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile mesa_agentes.py
      - name: Testes do simulador quando presentes
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          fi
      - name: Gerar relatório com dados sintéticos
        run: |
          python mesa_agentes.py demo
          test -s relatorio_demo.html
