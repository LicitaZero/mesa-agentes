name: mesa-agentes

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

concurrency:
  group: mesa
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rodada:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule != ''
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      publicar: ${{ steps.rodada.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restaurar, simular e salvar
        id: rodada
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          work="$RUNNER_TEMP/mesa-paper"
          if git ls-remote --exit-code --heads origin vivo >/dev/null; then
            git fetch --depth=1 origin vivo
            git worktree add --detach "$work" FETCH_HEAD
          else
            git worktree add --detach "$work" HEAD
            git -C "$work" switch --orphan vivo
          fi
          cd "$work"
          if [ -f ENCERRADO ]; then
            echo "Período encerrado. Resultado final preservado."
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -s pools.json ]; then
            python "$GITHUB_WORKSPACE/mesa_agentes.py" descobrir --top 5
            python -c "import json; p=json.load(open('pools.json')); assert 0 < len(p) <= 5, 'Nenhum pool elegível'"
            python "$GITHUB_WORKSPACE/mesa_agentes.py" baixar --paginas 3
          fi
          python "$GITHUB_WORKSPACE/mesa_agentes.py" ao-vivo --uma-vez
          python -c "import json; d=json.load(open('vivo.json')); assert d['moedas'], 'Sem candles reais disponíveis'"
          hoje=$(TZ=America/Sao_Paulo date +%F)
          publicar=false
          if [ "$EVENTO" = "workflow_dispatch" ] || [ "$(cat dia_relatorio 2>/dev/null || true)" != "$hoje" ] || [ -f ENCERRADO ]; then
            python "$GITHUB_WORKSPACE/mesa_agentes.py" backtest
            python "$GITHUB_WORKSPACE/mesa_agentes.py" viewer --saida "$RUNNER_TEMP/site/index.html"
            cp relatorio.html "$RUNNER_TEMP/site/backtest.html"
            printf '%s\n' "$hoje" > dia_relatorio
            publicar=true
          fi
          git add -- pools.json dados estado.json vivo.json
          for file in paper_log.jsonl ENCERRADO resultado.json dia_relatorio; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git -c user.name=mesa-bot -c user.email=mesa-bot@users.noreply.github.com commit -qm 'Atualiza simulação e estado'
            git push origin HEAD:refs/heads/vivo
          fi
          echo "publicar=$publicar" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        if: steps.rodada.outputs.publicar == 'true'
        with:
          path: ${{ runner.temp }}/site
  publicar:
    needs: rodada
    if: needs.rodada.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar painel
        id: deploy
        uses: actions/deploy-pages@v4
